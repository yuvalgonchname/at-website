<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Tulip AI…</title>
  <!-- Meta refresh fallback (works even with JavaScript disabled) -->
  <meta http-equiv="refresh" content="1; url=https://tulip.co/platform/tulip-ai/">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #1a1a2e;
    }
    .message {
      text-align: center;
    }
    a {
      color: #3d5afe;
    }
  </style>
</head>
<body>
  <div class="message">
    <p>Redirecting you to Tulip AI…</p>
    <p><a href="https://tulip.co/platform/tulip-ai/">Click here if you are not redirected automatically.</a></p>
  </div>
  <script>
    setTimeout(function () {
      window.location.replace("https://tulip.co/platform/tulip-ai/");
    }, 1000);
  </script>
</body>
</html>
