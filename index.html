<!DOCTYPE html>

<head>

    <style>
        body {
            background-color: #ADD8E6; /* Light blue */
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 800px;
            width: 90%;
        }

        h1, h2, h3 {
            margin: 20px 0;

        iframe {
            width: 100%;

<body>
    <div class="container">
        <h1>The Journey Continues.</h1>
        <h2>Akooda+Tulip = ❤️</h2>

        <!-- Video Embed -->

            src="https://www.youtube.com/embed/pMcxfJQFWxY?autoplay=1&mute=1"

    const timerEl = document.getElementById('timer');
